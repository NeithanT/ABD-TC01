apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app: sistema-estrellas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      env: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app: backend
        env: dev
    spec:
      containers:
        - name: backend
          image: abd-tc01-backend
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 300m
              memory: 2048Mi
          ports:
            - containerPort: 3000
              name: backend-port
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: REALM_NAME
              value: $(REALM_NAME)
            - name: KEYCLOAK_INTERNAL_URL
              value: http://keycloak-service:$(KEYCLOAK_INTERNAL_PORT)
            - name: KEYCLOAK_ISSUER
              value: $(BASE_URI):$(KEYCLOAK_PORT)/realms/$(REALM_NAME)
            - name: DB_HOST
              value: database-service
            - name: POSTGRES_USER
              value: $(POSTGRES_USER)
            - name: POSTGRES_PASSWORD
              value: $(POSTGRES_PASSWORD)
            - name: POSTGRES_DB
              value: $(POSTGRES_DB)
            - name: POSTGRE_INTERNAL_PORT
              value: ${POSTGRE_INTERNAL_PORT}

