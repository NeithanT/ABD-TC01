apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app: sistema-estrellas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      env: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app: frontend
        env: dev
    spec:
      containers:
        - name: frontend
          image: abd-tc01-frontend
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 300m
              memory: 2048Mi
          ports:
            - containerPort: 5173
              name: frontend-port
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: VITE_BACKEND_ROUTE
              value: $(BASE_URI):$(BACKEND_PORT)
            - name: VITE_AUTHORITY
              value: $(BASE_URI):$(KEYCLOAK_PORT)/realms/$(REALM_NAME)
            - name: VITE_CLIENT_ID
              value: $(CLIENT_ID)
            - name: VITE_TIMEOUT_TIME
              value: $(TIMEOUT_TIME)
