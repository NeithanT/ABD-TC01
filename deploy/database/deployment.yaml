apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    app.kubernetes.io/name: database
    app: sistema-estrellas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
      env: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database
        app: database
        env: dev
    spec:
      volumes:
        - name: db
          configMap: 
            name: db-init
      containers:
        - name: database
          image: postgres:17-alpine
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 300m
              memory: 2048Mi
          ports:
            - containerPort: 5432
              name: database-port
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: POSTGRES_USER
              value: $(POSTGRES_USER)
            - name: POSTGRES_PASSWORD
              value: $(POSTGRES_PASSWORD)
            - name: POSTGRES_DB
              value: $(POSTGRES_DB)
          volumeMounts:
            - name: db
              mountPath: /docker-entrypoint-initdb.d:ro
 


